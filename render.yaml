services:
  - type: web
    name: valyutabot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.main
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TG_SESSION_STRING
        sync: false
      - key: TARGET_CHATS
        value: "Xortumliklar,Xortum,Хортум,Хортумликлар"
      - key: BOOK_SOURCE_CHAT
        value: "onlayn_kutubxona_pdfo"
      - key: BOOK_STORAGE_CHAT
        sync: false
      - key: BOOK_STORAGE_CHAT_ID
        sync: false
